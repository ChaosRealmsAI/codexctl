<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Codex Session Viewer</title>
<style>
  :root {
    --bg: #0a0c10;
    --bg2: #12151c;
    --bg3: #181c25;
    --card: rgba(167, 139, 250, 0.04);
    --border: rgba(167, 139, 250, 0.12);
    --border-strong: rgba(167, 139, 250, 0.25);
    --text: #e8eaed;
    --text-dim: #9aa0a6;
    --text-faint: #5f6368;
    --purple: #a78bfa;
    --purple-soft: rgba(167, 139, 250, 0.12);
    --amber: #fbbf24;
    --amber-soft: rgba(251, 191, 36, 0.10);
    --green: #34d399;
    --green-soft: rgba(52, 211, 153, 0.10);
    --red: #f87171;
    --blue: #60a5fa;
    --blue-soft: rgba(96, 165, 250, 0.10);
    --mono: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
    --sans: -apple-system, 'PingFang SC', 'Noto Sans CJK SC', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.65;
    min-height: 100vh;
  }
  body {
    background:
      radial-gradient(ellipse 70% 35% at 50% 0%, rgba(167, 139, 250, 0.08), transparent 60%),
      var(--bg);
  }
  ::selection { background: var(--purple-soft); color: var(--text); }
  .wrap { max-width: 960px; margin: 0 auto; padding: 32px 28px 80px; }

  /* ============ HEADER ============ */
  .eyebrow {
    color: var(--purple);
    font-size: 11px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    opacity: 0.7;
    margin-bottom: 14px;
    font-weight: 500;
  }
  .h1 {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.015em;
    line-height: 1.35;
    margin-bottom: 18px;
    color: var(--text);
  }
  .h1.placeholder { color: var(--text-faint); font-weight: 400; }

  /* meta strip */
  .meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .meta-row .k { color: var(--text-faint); }
  .meta-row code {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text);
    margin-left: 4px;
  }
  .meta-row b { color: var(--text); font-weight: 500; margin-left: 4px; }
  .meta-divider { color: var(--border-strong); }
  .meta-row.command-mode { display: block; }
  .resume-command {
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.035);
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .resume-command-top {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    margin-bottom: 8px;
  }
  .resume-command-label {
    color: var(--text-faint);
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .resume-command code {
    display: block;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.7;
    color: var(--text);
  }
  .resume-command-sub {
    margin-top: 8px;
    color: var(--text-faint);
    font-family: var(--mono);
    font-size: 10.5px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .copy-command {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 10.5px;
    padding: 3px 8px;
    cursor: pointer;
  }
  .copy-command:hover { border-color: var(--border-strong); color: var(--text); }

  /* stats chips */
  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 16px 0 12px;
  }
  .chip {
    padding: 4px 10px;
    border: 1px solid var(--border);
    background: var(--card);
    font-size: 11.5px;
    color: var(--text-dim);
    font-family: var(--mono);
  }
  .chip b { color: var(--text); font-weight: 500; }
  .chip.purple b { color: var(--purple); }
  .chip.amber b { color: var(--amber); }
  .chip.green b { color: var(--green); }
  .chip.blue b { color: var(--blue); }

  /* token bar */
  .token-bar {
    margin-top: 10px;
    height: 4px;
    background: rgba(255,255,255,0.04);
    overflow: hidden;
    position: relative;
  }
  .token-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--purple), var(--amber));
    transition: width 400ms ease-out;
  }
  .token-label {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-faint);
    margin-top: 5px;
    display: flex;
    justify-content: space-between;
  }

  /* ============ FILE PICKER ============ */
  .picker {
    display: block;
    border: 1px dashed var(--border);
    background: var(--card);
    padding: 28px 20px;
    text-align: center;
    margin: 28px 0;
    cursor: pointer;
    transition: all 200ms;
    color: var(--text-dim);
  }
  .picker:hover { background: rgba(167, 139, 250, 0.07); border-color: var(--border-strong); }
  .picker input { display: none; }
  .picker.dragging { background: rgba(167, 139, 250, 0.12); border-color: var(--purple); color: var(--purple); }
  .picker .hint { font-size: 11px; margin-top: 6px; opacity: 0.6; font-family: var(--mono); }

  /* ============ TURN DIVIDER ============ */
  .turn-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 36px 0 18px;
    color: var(--text-faint);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .turn-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .mode-pill {
    padding: 3px 10px;
    border: 1px solid;
    font-weight: 500;
    letter-spacing: 0.15em;
  }
  .mode-pill.plan { color: var(--amber); border-color: rgba(251, 191, 36, 0.35); background: var(--amber-soft); }
  .mode-pill.default { color: var(--green); border-color: rgba(52, 211, 153, 0.35); background: var(--green-soft); }

  /* ============ EVENTS ============ */
  .event { margin: 14px 0; }
  .event-tag {
    font-size: 10.5px;
    color: var(--text-faint);
    letter-spacing: 0.05em;
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* USER MESSAGE — bubble · right-aligned */
  .msg-row {
    display: flex;
    margin: 12px 0;
    gap: 10px;
    align-items: flex-start;
  }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.agent { justify-content: flex-start; }
  .avatar {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    background: var(--bg2);
    color: var(--text-dim);
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
    margin-top: 2px;
  }
  .avatar.user { background: var(--purple-soft); color: var(--purple); border-color: rgba(167, 139, 250, 0.3); }
  .avatar.agent { background: var(--green-soft); color: var(--green); border-color: rgba(52, 211, 153, 0.3); }

  .msg-user, .msg-agent {
    max-width: 78%;
    padding: 12px 16px;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 14px;
    line-height: 1.65;
    border: 1px solid var(--border);
  }
  .msg-user {
    background: var(--purple-soft);
    border-color: rgba(167, 139, 250, 0.3);
    color: var(--text);
  }
  .msg-agent {
    background: var(--bg2);
    color: var(--text);
  }
  .msg-agent.md-content {
    white-space: normal;
  }
  .msg-agent.md-content h1,
  .msg-agent.md-content h2,
  .msg-agent.md-content h3,
  .msg-agent.md-content h4 {
    margin: 10px 0 6px;
    font-weight: 600;
    line-height: 1.35;
  }
  .msg-agent.md-content h1 { font-size: 18px; }
  .msg-agent.md-content h2 { font-size: 16px; color: var(--green); }
  .msg-agent.md-content h3,
  .msg-agent.md-content h4 { font-size: 14px; }
  .msg-agent.md-content p { margin: 6px 0; }
  .msg-agent.md-content p:first-child,
  .msg-agent.md-content h1:first-child,
  .msg-agent.md-content h2:first-child,
  .msg-agent.md-content h3:first-child,
  .msg-agent.md-content h4:first-child { margin-top: 0; }
  .msg-agent.md-content p:last-child,
  .msg-agent.md-content ul:last-child,
  .msg-agent.md-content ol:last-child,
  .msg-agent.md-content pre:last-child { margin-bottom: 0; }
  .msg-agent.md-content ul,
  .msg-agent.md-content ol { margin: 7px 0 7px 22px; padding: 0; }
  .msg-agent.md-content li { margin: 3px 0; }
  .msg-agent.md-content code {
    font-family: var(--mono);
    font-size: 12px;
    background: var(--bg3);
    padding: 1.5px 5px;
    color: var(--amber);
    border: 1px solid var(--border);
  }
  .msg-agent.md-content pre {
    background: var(--bg3);
    padding: 11px 13px;
    overflow-x: auto;
    margin: 10px 0;
    border-left: 2px solid var(--border-strong);
    white-space: pre;
  }
  .msg-agent.md-content pre code {
    background: transparent;
    padding: 0;
    border: 0;
    color: var(--text);
    font-size: 12px;
  }
  .msg-agent.md-content blockquote {
    margin: 8px 0;
    padding: 7px 12px;
    border-left: 2px solid var(--border-strong);
    color: var(--text-dim);
    background: rgba(255, 255, 255, 0.02);
  }
  .msg-agent.md-content strong { color: var(--text); font-weight: 600; }
  .msg-agent.md-content em { color: var(--text-dim); }
  .msg-agent.md-content a { color: var(--blue); text-decoration: none; border-bottom: 1px solid rgba(96, 165, 250, 0.4); }
  .msg-agent.intermediate {
    background: var(--bg2);
    color: var(--text-dim);
    font-size: 13.5px;
    border-color: var(--border);
    opacity: 0.9;
  }
  .msg-agent.final {
    background: var(--green-soft);
    border-color: rgba(52, 211, 153, 0.35);
    color: var(--text);
  }
  .msg-meta {
    font-size: 10.5px;
    color: var(--text-faint);
    margin-bottom: 4px;
    letter-spacing: 0.05em;
  }
  .msg-row.user .msg-meta { text-align: right; }
  .msg-col {
    display: flex;
    flex-direction: column;
    max-width: 78%;
  }
  .msg-col.user { align-items: flex-end; }
  .msg-user.has-injected {
    padding-bottom: 4px;
  }
  .injected-fold {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
    font-size: 11.5px;
  }
  .injected-fold summary {
    cursor: pointer;
    color: var(--text-faint);
    list-style: none;
    user-select: none;
  }
  .injected-fold summary::before { content: "▸ "; color: var(--text-faint); }
  .injected-fold[open] summary::before { content: "▾ "; }
  .injected-fold .body {
    margin-top: 8px;
    padding: 10px;
    background: var(--bg2);
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 11px;
    white-space: pre-wrap;
    max-height: 320px;
    overflow: auto;
  }


  /* REASONING — collapsed by default */
  details.reasoning, details.injected-block {
    margin: 6px 0;
  }
  details.reasoning summary,
  details.injected-block summary {
    cursor: pointer;
    color: var(--text-faint);
    font-size: 11.5px;
    list-style: none;
    user-select: none;
    padding: 3px 0;
  }
  details.reasoning summary::before { content: "▸ 💭 "; }
  details.reasoning[open] summary::before { content: "▾ 💭 "; }
  details.injected-block summary::before { content: "▸ "; }
  details.injected-block[open] summary::before { content: "▾ "; }
  details.reasoning .content,
  details.injected-block .content {
    margin-top: 6px;
    padding: 12px 14px;
    background: var(--bg2);
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1.7;
    white-space: pre-wrap;
    max-height: 360px;
    overflow: auto;
  }

  /* SHELL COMMAND — collapsed for long output */
  details.cmd {
    background: var(--bg2);
    margin: 6px 0;
    border-left: 2px solid var(--text-faint);
  }
  details.cmd[data-exit="0"] { border-left-color: var(--green); }
  details.cmd[data-exit="bad"] { border-left-color: var(--red); }
  details.cmd summary {
    cursor: pointer;
    padding: 7px 12px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    list-style: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  details.cmd summary::before { content: "▸"; color: var(--text-faint); width: 10px; }
  details.cmd[open] summary::before { content: "▾"; }
  .prompt { color: var(--green); }
  details.cmd[data-exit="bad"] .prompt { color: var(--red); }
  .cmd-body { padding: 0 12px 12px 28px; }
  .cmd-body pre {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 320px;
    overflow: auto;
    margin: 0;
  }
  .exit-tag {
    font-size: 10.5px;
    margin-left: auto;
    color: var(--text-faint);
    font-family: var(--mono);
  }
  .exit-tag.ok { color: var(--green); }
  .exit-tag.bad { color: var(--red); }

  /* QUESTIONS CARD — high priority */
  .qs-card {
    background: var(--amber-soft);
    border-left: 3px solid var(--amber);
    padding: 16px 20px;
    margin: 14px 0;
  }
  .qs-header {
    color: var(--amber);
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-bottom: 14px;
    font-weight: 500;
  }
  .q-block { margin-bottom: 18px; }
  .q-block:last-child { margin-bottom: 0; }
  .q-title {
    font-weight: 500;
    margin-bottom: 4px;
    font-size: 14px;
  }
  .q-id {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-faint);
    font-weight: 400;
    margin-left: 6px;
  }
  .q-question {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 9px;
  }
  .q-options { display: flex; flex-direction: column; gap: 6px; }
  .q-opt {
    padding: 9px 13px;
    border: 1px solid var(--border);
    background: transparent;
    transition: all 180ms;
  }
  .q-opt.chosen {
    background: var(--green-soft);
    border-color: rgba(52, 211, 153, 0.4);
  }
  .q-opt-label { font-weight: 500; font-size: 13px; }
  .q-opt.chosen .q-opt-label::before {
    content: "✓ ";
    color: var(--green);
    font-weight: 700;
  }
  .q-opt-desc { font-size: 11.5px; color: var(--text-dim); margin-top: 3px; }
  .recommended {
    color: var(--purple);
    font-size: 9.5px;
    letter-spacing: 0.12em;
    background: var(--purple-soft);
    padding: 2px 7px;
    margin-left: 8px;
    vertical-align: 1.5px;
    text-transform: uppercase;
    font-weight: 500;
  }

  /* PLAN CARD — highest priority */
  .plan-card {
    background: var(--green-soft);
    border-left: 3px solid var(--green);
    padding: 22px 26px;
    margin: 16px 0;
  }
  .plan-card .badge {
    color: var(--green);
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-bottom: 14px;
    font-weight: 500;
  }
  .plan-content { color: var(--text); font-size: 14px; }
  .plan-content h1 { font-size: 22px; font-weight: 600; margin: 18px 0 10px; letter-spacing: -0.01em; }
  .plan-content h2 { font-size: 16px; font-weight: 600; margin: 18px 0 6px; color: var(--purple); }
  .plan-content h3 { font-size: 14px; font-weight: 600; margin: 14px 0 4px; color: var(--text); }
  .plan-content p { margin: 7px 0; }
  .plan-content ul, .plan-content ol { margin: 7px 0 7px 22px; }
  .plan-content li { margin: 3px 0; }
  .plan-content code {
    font-family: var(--mono);
    font-size: 12px;
    background: var(--bg3);
    padding: 1.5px 6px;
    color: var(--amber);
    border: 1px solid var(--border);
  }
  .plan-content pre {
    background: var(--bg3);
    padding: 12px 14px;
    overflow-x: auto;
    margin: 10px 0;
    border-left: 2px solid var(--border-strong);
  }
  .plan-content pre code {
    background: transparent;
    padding: 0;
    border: 0;
    color: var(--text);
    font-size: 12px;
  }
  .plan-content strong { color: var(--text); font-weight: 600; }
  .plan-content a { color: var(--blue); }

  /* UPDATE_PLAN (TODO list) */
  .todo-card {
    background: var(--blue-soft);
    border-left: 3px solid var(--blue);
    padding: 14px 18px;
    margin: 12px 0;
  }
  .todo-header {
    color: var(--blue);
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-bottom: 10px;
    font-weight: 500;
  }
  .todo-explanation {
    font-size: 12.5px;
    color: var(--text-dim);
    margin-bottom: 10px;
    font-style: italic;
  }
  .todo-list { display: flex; flex-direction: column; gap: 5px; }
  .todo-item {
    display: flex;
    gap: 10px;
    font-size: 13px;
    align-items: flex-start;
  }
  .todo-status { width: 18px; flex-shrink: 0; font-family: var(--mono); }
  .todo-item.completed .todo-status { color: var(--green); }
  .todo-item.in_progress .todo-status { color: var(--amber); }
  .todo-item.pending .todo-status { color: var(--text-faint); }
  .todo-item.completed .todo-text { color: var(--text-dim); text-decoration: line-through; opacity: 0.7; }
  .todo-item.in_progress .todo-text { color: var(--text); font-weight: 500; }
  .todo-item.pending .todo-text { color: var(--text-dim); }

  /* PATCH / FILE CHANGE */
  .patch-card {
    background: var(--bg2);
    border-left: 2px solid var(--purple);
    margin: 8px 0;
  }
  details.patch summary {
    cursor: pointer;
    padding: 9px 14px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    list-style: none;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  details.patch summary::before { content: "▸"; color: var(--text-faint); width: 10px; }
  details.patch[open] summary::before { content: "▾"; }
  .patch-tag {
    padding: 1.5px 6px;
    font-size: 10px;
    letter-spacing: 0.1em;
    font-weight: 500;
  }
  .patch-tag.add { color: var(--green); background: var(--green-soft); }
  .patch-tag.update { color: var(--amber); background: var(--amber-soft); }
  .patch-tag.delete { color: var(--red); background: rgba(248,113,113,0.1); }
  .patch-tag.rename { color: var(--blue); background: var(--blue-soft); }
  .patch-meta { color: var(--text-faint); font-size: 11px; margin-left: auto; }
  .patch-body {
    padding: 0 14px 14px 30px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 360px;
    overflow: auto;
  }

  /* GOAL bar — 顶部高优先级 */
  .goal-bar {
    margin: 14px 0 18px;
    padding: 14px 18px;
    background: linear-gradient(90deg, rgba(167, 139, 250, 0.12), rgba(251, 191, 36, 0.06));
    border-left: 3px solid var(--purple);
  }
  .goal-bar-head {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    color: var(--purple);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-bottom: 8px;
    font-weight: 500;
  }
  .goal-status {
    padding: 2px 8px;
    font-size: 10px;
    letter-spacing: 0.15em;
    background: var(--purple-soft);
    color: var(--purple);
  }
  .goal-status.achieved, .goal-status.complete { background: var(--green-soft); color: var(--green); }
  .goal-status.unmet, .goal-status.failed { background: rgba(248,113,113,0.1); color: var(--red); }
  .goal-status.budget_limited { background: var(--amber-soft); color: var(--amber); }
  .goal-status.cleared { background: rgba(255,255,255,0.04); color: var(--text-faint); }
  .goal-objective {
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 10px;
  }
  .goal-budget-row {
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
  }
  .goal-budget-bar {
    flex: 1;
    height: 4px;
    background: rgba(255,255,255,0.04);
    overflow: hidden;
  }
  .goal-budget-fill {
    height: 100%;

let LANG = localStorage.getItem('codexctl-viewer-lang') || 'en';

function setLang(lang) {

  LANG = lang;
  localStorage.setItem('codexctl-viewer-lang', lang);
  $('lang-en').classList.toggle('active', lang === 'en');
  $('lang-cn').classList.toggle('active', lang === 'cn');
  applyStaticI18n();
  if (LAST_PROCESSED) processSession(LAST_PROCESSED.text, LAST_PROCESSED.name);
}
function applyStaticI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (key) el.textContent = t(key);
  });
  // legend
  const lg = $('legend');
  if (lg) {

    lg.innerHTML = items.map(k =>
      `<span><code>${t('legend_'+k+'_kind')}</code> ${t('legend_'+k)}</span>`
    ).join('');
  }
}
let LAST_PROCESSED = null;
const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);

function normalizeSourceInfo(source) {
  if (source && typeof source === 'object') return source;
  return { name: source || '' };
}

function shellQuote(value) {
  const text = String(value ?? '');
  if (/^[A-Za-z0-9_@%+=:,./-]+$/.test(text)) return text;
  return `'${text.replace(/'/g, `'\\''`)}'`;
}

function deriveCodexHome(sourcePath) {
  if (!sourcePath) return '';
  const marker = '/sessions/';
  const idx = String(sourcePath).indexOf(marker);
  return idx > 0 ? String(sourcePath).slice(0, idx) : '';
}

function buildResumeCommand(meta, sourceInfo) {
  const threadId = meta?.id || '';
  if (!threadId) return '';
  const cwd = meta.cwd || '';
  const codexBin = sourceInfo.codexBin || 'codex';
  const codexHome = sourceInfo.codexHome || meta.codex_home || deriveCodexHome(sourceInfo.sourcePath);
  const env = codexHome ? `CODEX_HOME=${shellQuote(codexHome)} ` : '';
  const resume = `${shellQuote(codexBin)} resume --include-non-interactive ${shellQuote(threadId)}`;
  const command = `${env}${resume}`;
  return cwd ? `cd ${shellQuote(cwd)} && ${command}` : command;
}

function renderResumeCommand(command, meta, sourceInfo) {
  if (!command) {
    return `<div class="resume-command"><span class="resume-command-label">resume command unavailable</span><code>thread id not found in this JSONL</code></div>`;
  }
  const details = [];
  if (meta.id) details.push(`<span>thread ${escapeHtml(meta.id.slice(0, 8))}...</span>`);
  if (sourceInfo.sourcePath) details.push(`<span>jsonl ${escapeHtml(sourceInfo.sourcePath)}</span>`);
  return `
    <div class="resume-command">
      <div class="resume-command-top">
        <span class="resume-command-label">resume command</span>
        <button class="copy-command" type="button" data-copy-command="${escapeHtml(command)}">copy</button>
      </div>
      <code>${escapeHtml(command)}</code>
      ${details.length ? `<div class="resume-command-sub">${details.join('')}</div>` : ''}
    </div>`;
}

document.addEventListener('click', async (event) => {
  const button = event.target.closest('[data-copy-command]');
  if (!button) return;
  try {
    await navigator.clipboard.writeText(button.dataset.copyCommand || '');
    const oldText = button.textContent;
    button.textContent = 'copied';
    setTimeout(() => { button.textContent = oldText; }, 1200);
  } catch (error) {
    button.textContent = 'copy failed';
  }
});

// ============== MARKDOWN (lightweight) ==============
function renderMarkdown(md) {
  if (!md) return '';
  // 提 fenced code
  const codes = [];
  md = md.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    codes.push({ lang, code });
    return `__CODE__CODE${codes.length - 1}__CODE__`;
  });
  // 提 inline code
  const inlines = [];
  md = md.replace(/`([^`\n]+)`/g, (_, c) => {
    inlines.push(c);
    return `__INLINE__IN${inlines.length - 1}__INLINE__`;
  });
  let html = escapeHtml(md);
  // headings (从大到小)
  html = html.replace(/^####\s+(.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^##\s+(.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^#\s+(.+)$/gm, '<h1>$1</h1>');
  // blockquote
  html = html.replace(/((?:^&gt;\s+.+\n?)+)/gm, (block) => {
    const lines = block.trim().split(/\n/).map(l => l.replace(/^&gt;\s+/, '')).join('<br>');
    return `<blockquote>${lines}</blockquote>`;
  });
  // bold
  html = html.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  // emphasis
  html = html.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  // links (escaped text and URL stay escaped; unsafe protocols are rendered as text)
  html = html.replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, (_, text, href) => {
    const decoded = href.replace(/&amp;/g, '&').replace(/&quot;/g, '"').replace(/&#39;/g, "'");
    if (!/^(https?:\/\/|mailto:|#|\/)/i.test(decoded)) return `${text} (${href})`;
    return `<a href="${href}" target="_blank" rel="noreferrer">${text}</a>`;
  });
  // bullet list
  html = html.replace(/((?:^[ ]*[-*]\s+.+\n?)+)/gm, (block) => {
    const items = block.trim().split(/\n/).filter(Boolean).map(l => `<li>${l.replace(/^[ ]*[-*]\s+/, '')}</li>`).join('');
    return `<ul>${items}</ul>`;
  });
  // numbered list
  html = html.replace(/((?:^[ ]*\d+\.\s+.+\n?)+)/gm, (block) => {
    const items = block.trim().split(/\n/).filter(Boolean).map(l => `<li>${l.replace(/^[ ]*\d+\.\s+/, '')}</li>`).join('');
    return `<ol>${items}</ol>`;
  });
  // paragraphs
  html = html.split(/\n{2,}/).map(p => {
    p = p.trim();
    if (!p) return '';
    if (/^<(h\d|ul|ol|pre|blockquote)/.test(p)) return p;
    return `<p>${p.replace(/\n/g, '<br>')}</p>`;
  }).join('\n');
  // restore inline + fenced
  html = html.replace(/__INLINE__IN(\d+)__INLINE__/g, (_, i) => `<code>${escapeHtml(inlines[i])}</code>`);
  html = html.replace(/__CODE__CODE(\d+)__CODE__/g, (_, i) => `<pre><code>${escapeHtml(codes[i].code)}</code></pre>`);
  return html;
}

// ============== USER MESSAGE STRIP ==============
// 剥离 codex 自动注入的所有 wrapper · 留真实 prompt
const INJECT_TAGS = [
  'environment_context',
  'INSTRUCTIONS',
  'user_instructions',
  'collaboration_mode',
  'subagent_notification',
  // 注: untrusted_objective 不剥离 · viewer 专门渲染 goal 卡片
  'turn_aborted',
  'permissions_instructions',
  'current_objective',
];
function stripInjections(text) {
  if (!text) return { real: '', injected: '' };
  let real = text;
  let injected = '';

  // 1. 剥所有已知 wrapper 标签块
  for (const tag of INJECT_TAGS) {
    const re = new RegExp(`<${tag}>[\\s\\S]*?<\\/${tag}>\\s*`, 'g');
    real = real.replace(re, (m) => { injected += m + '\n\n'; return ''; });
  }

  // 2. AGENTS.md / CLAUDE.md 标题块 (注: 此时 INSTRUCTIONS 已剥)
  real = real.replace(/^#\s+(AGENTS|CLAUDE)\.md\s+instructions\s+for\s+[^\n]*\n*/im, (m) => {
    injected += m; return '';
  });

  // 3. 其他 codex 头部模式 (`# Codex AGENTS.md` 等)
  real = real.replace(/^#\s+Codex\s+(AGENTS|CLAUDE)\.md[\s\S]*?(?=\n\n\S|$)/im, (m) => {
    injected += m + '\n\n'; return '';
  });

  // 4. 尾部多余空行
  real = real.trim();
  injected = injected.trim();
  return { real, injected };
}

// 提取 assistant 消息里的 <proposed_plan> 内容 + 剩余文本
function extractProposedPlan(text) {
  if (!text || !text.includes('<proposed_plan>')) return { plan: null, rest: text };
  const m = text.match(/<proposed_plan>([\s\S]*?)<\/proposed_plan>/);
  if (!m) return { plan: null, rest: text };
  const plan = m[1].trim();
  const rest = text.replace(m[0], '').trim();
  return { plan, rest };
}

// ============== RENDER QUESTIONS ==============
function renderQuestions(questions, answersForTurn) {
  const html = questions.map(q => {
    const opts = (q.options || []).map(o => {
      const lab = o.label || '';
      const isRec = /\(recommended\)/i.test(lab) || lab.includes('(推荐)') || lab.includes('（推荐）');
      const ans = answersForTurn?.[q.id]?.answers?.[0];
      const chosen = ans === lab;
      return `
        <div class="q-opt ${chosen ? 'chosen' : ''}">
          <div class="q-opt-label">${escapeHtml(lab)}${isRec ? '<span class="recommended">recommended</span>' : ''}</div>
          ${o.description ? `<div class="q-opt-desc">${escapeHtml(o.description)}</div>` : ''}
        </div>`;
    }).join('');
    return `
      <div class="q-block">
        <div class="q-title">${escapeHtml(q.header || '')}<span class="q-id">${escapeHtml(q.id)}</span></div>
        <div class="q-question">${escapeHtml(q.question || '')}</div>
        <div class="q-options">${opts}</div>
      </div>`;
  }).join('');
  return `<div class="qs-card"><div class="qs-header">${t('reflexive_q_header')} · ${questions.length}</div>${html}</div>`;
}

// ============== RENDER UPDATE_PLAN (TODO) ==============
function renderUpdatePlan(args) {
  let plan, explanation;
  try {
    const a = JSON.parse(args);
    plan = a.plan || [];
    explanation = a.explanation || '';
  } catch (e) { return ''; }

    <div class="todo-item ${s.status}">

      ${expl}
      <div class="todo-list">${items}</div>
    </div>`;
}

// ============== RENDER PATCH ==============
function renderPatch(ev) {
  const p = ev.payload || {};
  const success = p.success !== false;
  const changes = p.changes || {};
  const files = Object.entries(changes);
  if (files.length === 0) return '';

  const cards = files.map(([path, info]) => {
    const action = info.type || 'update';
    const tagCls = ['add', 'update', 'delete', 'rename'].includes(action) ? action : 'update';
    const content = info.content || info.diff || '';
    const lines = content.split('\n').length;
    const meta = `${lines} ${t('lines_word')}`;
    return `
      <details class="patch">
        <summary>
          <span class="patch-tag ${tagCls}">${action.toUpperCase()}</span>
          <code>${escapeHtml(path)}</code>
          <span class="patch-meta">${meta}</span>
        </summary>
        <div class="patch-body">${escapeHtml(content.slice(0, 30000))}${content.length > 30000 ? '\n...(truncated)' : ''}</div>
      </details>`;
  }).join('');
  const head = success ? '' : '<div class="alert">⚠ patch failed</div>';
  return head + cards;
}

// ============== RENDER SHELL CMD ==============
function renderCmd(ev) {
  const p = ev.payload || {};
  const cmd = (p.command || []).join(' ').replace(/^\/bin\/zsh -lc /, '');
  const out = (p.aggregated_output || p.stdout || '') + (p.stderr ? '\n' + p.stderr : '');
  const exit = p.exit_code;
  const exitCls = exit === 0 ? 'ok' : 'bad';
  const dataExit = exit === 0 ? '0' : 'bad';
  const dur = p.duration?.secs ? ` · ${p.duration.secs}s` : '';
  const collapsed = out.length > 200 || out.split('\n').length > 5;
  return `
    <details class="cmd" data-exit="${dataExit}" ${collapsed ? '' : 'open'}>
      <summary>
        <span class="prompt">$</span>
        <span style="flex:1; word-break:break-all">${escapeHtml(cmd.slice(0, 200))}</span>
        <span class="exit-tag ${exitCls}">exit ${exit}${dur}</span>
      </summary>
      <div class="cmd-body"><pre>${escapeHtml(out.slice(0, 8000))}${out.length > 8000 ? '\n...(truncated)' : ''}</pre></div>
    </details>`;
}

// ============== MAIN RENDER ==============
function renderTimeline(events) {
  // 1) 收 answers map by turn (function_call_output with answers JSON)
  const answersByTurn = {};
  let curTurnForCollect = null;
  for (const ev of events) {
    if (ev.type === 'turn_context') curTurnForCollect = ev.payload?.turn_id;
    if (ev.payload?.type === 'function_call_output') {
      try {
        const out = JSON.parse(ev.payload.output);
        if (out.answers) {
          if (!answersByTurn[curTurnForCollect]) answersByTurn[curTurnForCollect] = {};
          Object.assign(answersByTurn[curTurnForCollect], out.answers);
        }
      } catch (e) {}
    }
  }

  // 2) 配对 function_call (request_user_input/exec_command/update_plan/apply_patch) -> outputs (in event_msg)
  const pendingExec = new Map(); // call_id -> command for fallback
  const blocks = [];
  let curTurn = null;
  let curMode = 'default';
  let assistantMsgIndex = 0; // 用于判断是否是最后的(最重要的)消息
  let allAssistantMsgs = events.filter(e => e.type === 'response_item' && e.payload?.type === 'message' && e.payload?.role === 'assistant').length;

  // 统计未识别 / 已识别事件
  const unknownTypes = {};
  const recognized = new Set();

  for (const ev of events) {
    // 解析失败兜底
    if (ev._parseError) {
      blocks.push(`
        <div class="alert">
          <b>⚠ ${t('parse_error')}</b> · ${escapeHtml(ev._err)}
          <pre style="margin-top:6px;font-size:11px;color:var(--text-faint);white-space:pre-wrap;word-break:break-all">${escapeHtml(ev._raw)}</pre>
        </div>`);
      continue;
    }

    const evType = ev.type;
    const p = ev.payload || {};

    // turn boundary
    if (evType === 'turn_context') {
      const turnId = p.turn_id || '';
      const mode = p.collaboration_mode?.mode || 'default';
      if (turnId !== curTurn) {
        curTurn = turnId;
        curMode = mode;
        const num = blocks.filter(b => /turn-divider/.test(b)).length + 1;
        blocks.push(`
          <div class="turn-divider">
            <span class="mode-pill ${mode}">${mode}</span>
            <span>turn ${num} · ${turnId.slice(0, 8)}</span>
          </div>`);
      }
      continue;
    }

    if (evType === 'compacted') {
      blocks.push('<div class="compact-mark">context compacted</div>');
      continue;
    }

    // ============ response_item ============
    if (evType === 'response_item') {
      const ptype = p.type;

      // user message — 剥离注入
      if (ptype === 'message' && p.role === 'user') {
        const fullText = (p.content || []).map(c => c.text || '').join('');
        const { real, injected } = stripInjections(fullText);
        if (!real && !injected) continue;
        // 全注入消息 (real 为空) → 折叠成一行, 不占主流
        if (!real) {
          const label = fullText.includes('<turn_aborted>') ? 'turn aborted'
                      : fullText.includes('AGENTS.md instructions') ? 'codex injected: AGENTS.md + environment_context'
                      : fullText.includes('<environment_context>') ? 'environment_context injection'
                      : 'codex system injection';
          blocks.push(`
            <details class="injected-block">
              <summary>${escapeHtml(label)} (${(injected.length / 1024).toFixed(1)} KB)</summary>
              <div class="content">${escapeHtml(injected.slice(0, 8000))}${injected.length > 8000 ? '\n...(truncated)' : ''}</div>
            </details>`);
          continue;
        }
        // 有真实 prompt → 右侧紫色气泡
        const injHtml = injected ? `
          <details class="injected-fold">
            <summary>codex 注入: AGENTS.md / environment / instructions (${(injected.length / 1024).toFixed(1)} KB)</summary>
            <div class="body">${escapeHtml(injected.slice(0, 8000))}${injected.length > 8000 ? '\n...(truncated)' : ''}</div>
          </details>` : '';
        blocks.push(`
          <div class="msg-row user">
            <div class="msg-col user">
              <div class="msg-meta">USER</div>
              <div class="msg-user ${injected ? 'has-injected' : ''}">${escapeHtml(real)}${injHtml}</div>
            </div>
            <div class="avatar user">👤</div>
          </div>`);
        continue;
      }

      // developer message — 大多数折叠, untrusted_objective 渲染成 goal 卡片
      if (ptype === 'message' && p.role === 'developer') {
        const txt = (p.content || []).map(c => c.text || '').join('');
        if (txt.length < 30) continue;

        // 识别 goal 设置 (untrusted_objective + Budget 块)
        if (txt.includes('<untrusted_objective>')) {
          const objMatch = txt.match(/<untrusted_objective>([\s\S]+?)<\/untrusted_objective>/);
          const objective = objMatch ? objMatch[1].trim() : '';
          const tu = +(txt.match(/Tokens used:\s*(\d+)/)?.[1] || 0);
          const tb_raw = txt.match(/Token budget:\s*(\w+)/)?.[1] || 'unlimited';
          const tb = (tb_raw === 'unlimited' || tb_raw === 'none') ? null : +tb_raw;
          const time_s = +(txt.match(/Time spent pursuing goal:\s*(\d+)/)?.[1] || 0);
          const over = tb && tu > tb;
          const pct = tb ? Math.min(100, (tu / tb) * 100) : 0;
          const budgetLabel = tb
            ? `${tu.toLocaleString()} / ${tb.toLocaleString()} tokens${over ? ' · ' + t('over_budget') : ''}`
            : `${tu.toLocaleString()} tokens · ${t('unlimited_budget')}`;
          const status = over ? 'budget_limited' : 'pursuing';
          const statusLabel = over ? t('goal_budget_limited') : t('goal_pursuing');
          blocks.push(`
            <div class="goal-bar">
              <div class="goal-bar-head">
                <span>${t('goal_label')}</span>
                <span class="goal-status ${status}">${statusLabel}</span>
                ${time_s > 0 ? `<span style="margin-left:auto;color:var(--text-faint);font-size:10.5px;font-family:var(--mono)">${time_s}s</span>` : ''}
              </div>
              <div class="goal-objective">${escapeHtml(objective)}</div>
              <div class="goal-budget-row">
                <span>${escapeHtml(budgetLabel)}</span>
                ${tb ? `<div class="goal-budget-bar"><div class="goal-budget-fill ${over ? 'over' : ''}" style="width:${pct}%"></div></div><span>${pct.toFixed(0)}%</span>` : ''}
              </div>
            </div>`);
          continue;
        }

        // 其他 developer 消息折叠
        const label = txt.includes('<collaboration_mode>') ? 'plan mode protocol prompt'
                    : txt.includes('<permissions') ? 'permissions prompt'
                    : 'developer message';
        blocks.push(`
          <details class="injected-block">
            <summary>${escapeHtml(label)} (${(txt.length / 1024).toFixed(1)} KB)</summary>
            <div class="content">${escapeHtml(txt.slice(0, 8000))}${txt.length > 8000 ? '\n...' : ''}</div>
          </details>`);
        continue;
      }

      // assistant message
      if (ptype === 'message' && p.role === 'assistant') {
        assistantMsgIndex++;
        const fullText = (p.content || []).map(c => c.text || '').join('');
        const { plan, rest } = extractProposedPlan(fullText);
        if (plan) {
          blocks.push(`
            <div class="plan-card">
              <div class="badge">📋 PROPOSED PLAN</div>
              <div class="plan-content">${renderMarkdown(plan)}</div>
            </div>`);
        }
        if (rest && rest.length > 0) {
          // 最后一条 assistant 消息算最终回复 → 高优先级
          const isFinal = assistantMsgIndex === allAssistantMsgs;
          const cls = isFinal ? 'final' : 'intermediate';
          const meta = isFinal ? 'CODEX · FINAL' : 'codex';
          blocks.push(`
            <div class="msg-row agent">
              <div class="avatar agent">🤖</div>
              <div class="msg-col">
                <div class="msg-meta">${meta}</div>
                <div class="msg-agent ${cls} md-content">${renderMarkdown(rest)}</div>
              </div>
            </div>`);
        }
        continue;
      }

      // reasoning
      if (ptype === 'reasoning') {
        const summaries = (p.summary || []).map(s => s.text || '').filter(Boolean).join('\n\n');
        if (summaries) {
          blocks.push(`
            <details class="reasoning">
              <summary>reasoning · ${(summaries.length / 1024).toFixed(1)} KB</summary>
              <div class="content">${escapeHtml(summaries)}</div>
            </details>`);
        }
        continue;
      }

      // function_call
      if (ptype === 'function_call') {
        const name = p.name;
        if (name === 'request_user_input') {
          try {
            const args = JSON.parse(p.arguments);
            if (args.questions) blocks.push(renderQuestions(args.questions, answersByTurn[curTurn]));
          } catch (e) {}
        } else if (name === 'update_plan') {
          blocks.push(renderUpdatePlan(p.arguments || ''));
        } else if (name === 'shell' || name === 'exec_command') {
          // 占位等 exec_command_end 来; 但 args 也保留
          try {
            const args = JSON.parse(p.arguments);
            const cmd = (args.command || []).join(' ');
            pendingExec.set(p.call_id, cmd);
          } catch (e) {}
        } else if (name === 'update_goal') {
          try {
            const args = JSON.parse(p.arguments || '{}');
            const status = args.status || '?';
            const reason = args.reason || '';
            const cls = status === 'achieved' ? 'achieved'
                      : status === 'unmet' || status === 'budget_limited' ? status
                      : 'pursuing';
            blocks.push(`
              <div class="update-goal-card">
                <b>${t('update_goal_label')}</b>
                <span class="goal-status ${cls}">${escapeHtml(status.toUpperCase())}</span>
                ${reason ? `<div style="margin-top:4px;color:var(--text-dim);font-size:12px">${escapeHtml(reason)}</div>` : ''}
              </div>`);
          } catch (e) {}
        } else if (name === 'get_goal') {
          // codex 自查 goal 状态 · 静默
        } else if (name === 'view_image') {
          try {
            const args = JSON.parse(p.arguments);
            blocks.push(`<div class="event"><div class="event-tag">🖼 view_image</div><div style="font-family:var(--mono);font-size:11.5px;color:var(--text-dim);padding:6px 10px;background:var(--bg2)">${escapeHtml(args.path || '?')}</div></div>`);
          } catch (e) {}
        }
        continue;
      }

      // function_call_output for shell - if it has answers (request_user_input output) we skip (already in answers map)
      if (ptype === 'function_call_output') {
        // try parsing for answers (already aggregated)
        const out = p.output || '';
        if (out.includes('"answers"')) {
          // 显示 answers rollup
          try {
            const parsed = JSON.parse(out);
            if (parsed.answers) {
              const summary = Object.entries(parsed.answers).map(([k, v]) => `${k}=${v.answers?.[0] || '?'}`).join(' · ');
              blocks.push(`<div class="answers-card"><b>↩ answer</b> ${escapeHtml(summary)}</div>`);
            }
          } catch (e) {}
        }
        continue;
      }

      // custom_tool_call (apply_patch)
      if (ptype === 'custom_tool_call') {
        if (p.name === 'apply_patch') {
          // 占位等 patch_apply_end
        }
        continue;
      }

      continue;
    }

    // ============ event_msg ============
    if (evType === 'event_msg') {
      const ptype = p.type;
      if (ptype === 'exec_command_end') { blocks.push(renderCmd(ev)); continue; }
      if (ptype === 'patch_apply_end') { blocks.push(renderPatch(ev)); continue; }
      if (ptype === 'warning') { blocks.push(`<div class="alert warn">${escapeHtml(p.message || 'warning')}</div>`); continue; }
      if (ptype === 'turn_aborted') { blocks.push('<div class="alert">⚠ turn aborted</div>'); continue; }
      if (ptype === 'item_completed') {
        const item = p.item || {};
        if (item.type === 'plan') {
          blocks.push(`
            <div class="plan-card">
              <div class="badge">📋 PLAN ITEM</div>
              <div class="plan-content">${renderMarkdown(item.text || '')}</div>
            </div>`);
        }
        continue;
      }
      // 静默事件: token_count(头部已用) / task_started / task_complete / agent_message(被 response_item 覆盖)
      const SILENT = new Set(['token_count', 'task_started', 'task_complete', 'agent_message',
                              'view_image_tool_call', 'web_search_end', 'image_generation_end',
                              'mcp_tool_call_end', 'context_compacted',
                              'collab_agent_spawn_end', 'collab_waiting_end', 'collab_close_end',
                              'collab_agent_interaction_end']);
      if (SILENT.has(ptype)) continue;

      // 兜底: 未识别 event_msg
      const fullKey = `event_msg:${ptype || '?'}`;
      unknownTypes[fullKey] = (unknownTypes[fullKey] || 0) + 1;
      blocks.push(renderUnknown(ev, fullKey));
      continue;
    }

    // ============ daemon log 格式 (没有 type 字段 · 有 direction + summary) ============
    if (!evType && ev.direction) {
      const dir = ev.direction;
      const sm = ev.summary || {};
      const ts = ev.ts_ms ? new Date(ev.ts_ms).toLocaleTimeString() : '';
      const dirIcon = dir === 'out' ? '→' : dir === 'in' ? '←' : '·';
      const dirCol = dir === 'out' ? 'var(--blue)' : dir === 'in' ? 'var(--green)' : 'var(--text-faint)';
      const label = sm.method || sm.kind || JSON.stringify(sm).slice(0, 60);
      blocks.push(`
        <div style="display:flex;gap:10px;font-family:var(--mono);font-size:11.5px;padding:5px 12px;border-left:2px solid ${dirCol};margin:3px 0;background:var(--bg2)">
          <span style="color:${dirCol};font-weight:600">${dirIcon}</span>
          <span style="color:var(--text-faint);min-width:64px">${escapeHtml(ts)}</span>
          <span style="color:var(--text)">${escapeHtml(label)}</span>
          ${sm.id != null ? `<span style="color:var(--text-faint);margin-left:auto">id ${sm.id}</span>` : ''}
        </div>`);
      continue;
    }

    // 兜底: 完全未识别的顶层 type
    const fullKey = evType || (ev.direction ? 'daemon-log' : 'unknown');
    unknownTypes[fullKey] = (unknownTypes[fullKey] || 0) + 1;
    blocks.push(renderUnknown(ev, fullKey));
  }

  // 在底部加未识别事件统计 (调试用)
  if (Object.keys(unknownTypes).length > 0) {
    const summary = Object.entries(unknownTypes).map(([k, v]) => `${k}×${v}`).join(' · ');
    blocks.push(`<div class="alert info" style="margin-top:24px">ℹ️ ${Object.values(unknownTypes).reduce((a,b)=>a+b,0)} unrecognized events shown as raw: ${escapeHtml(summary)}</div>`);
  }

  return blocks.join('\n');
}

// ============== UNKNOWN EVENT FALLBACK ==============
function renderUnknown(ev, key) {
  const ts = ev.timestamp || ev.ts_ms || '';
  const tsShow = ts ? (typeof ts === 'string' ? ts.slice(11, 19) : new Date(ts).toLocaleTimeString()) : '';
  const json = JSON.stringify(ev, null, 2);
  const preview = json.length > 200 ? json.slice(0, 200) + '...' : json;
  return `
    <details class="unknown-event">
      <summary>
        <span class="unknown-tag">${escapeHtml(key)}</span>
        ${tsShow ? `<span style="color:var(--text-faint);font-size:10.5px;font-family:var(--mono);margin-left:8px">${escapeHtml(tsShow)}</span>` : ''}
        <span style="margin-left:auto;color:var(--text-faint);font-size:10.5px;font-family:var(--mono)">${json.length} bytes</span>
      </summary>
      <pre class="unknown-body">${escapeHtml(json.slice(0, 8000))}${json.length > 8000 ? '\n...(truncated)' : ''}</pre>
    </details>`;
}

// ============== STATS / META ==============
function parseInput(text) {
  const lines = text.split('\n').filter(line => line.trim().length > 0);
  const records = [];
  let parseErrors = 0;
  for (const line of lines) {
    try {
      records.push(JSON.parse(line));
    } catch (e) {
      parseErrors++;
      records.push({ _parseError: true, _raw: line.slice(0, 500), _err: e.message });
    }
  }
  return { records, lineCount: lines.length, parseErrors, format: 'jsonl' };
}

function processSession(text, source) {
  LAST_PROCESSED = { text, name: source };
  const sourceInfo = normalizeSourceInfo(source);
  const name = sourceInfo.name || sourceInfo.sourcePath || 'rollout.jsonl';
  const parsed = parseInput(text);
  const events = parsed.records;
  const parseErrors = parsed.parseErrors;
  $('picker').style.display = 'none';
  if (parseErrors > 0) {
    console.warn(`${parseErrors} parse errors (out of ${parsed.lineCount} lines)`);
  }

  // 文件元数据 bar (兜底友好)
  const metaCounts = {};
  for (const ev of events) {
    if (ev._parseError) { metaCounts['_parseError'] = (metaCounts['_parseError']||0)+1; continue; }
    const tType = ev.type || '?';
    const sub = ev.payload?.type || ev.payload?.name;
    const k = sub ? `${tType}:${sub}` : tType;
    metaCounts[k] = (metaCounts[k]||0) + 1;
  }
  const sortedTypes = Object.entries(metaCounts).sort((a,b)=>b[1]-a[1]);
  const fileMeta = [];
  fileMeta.push(`<span><span class="k">file</span> <span class="v">${escapeHtml(name || '?')}</span></span>`);
  fileMeta.push(`<span><span class="k">format</span> <span class="v">${escapeHtml(parsed.format)}</span></span>`);
  fileMeta.push(`<span><span class="k">lines</span> <span class="v">${parsed.lineCount.toLocaleString()}</span></span>`);
  fileMeta.push(`<span><span class="k">events</span> <span class="v">${(events.length - parseErrors).toLocaleString()}</span></span>`);
  if (parseErrors > 0) fileMeta.push(`<span style="color:var(--red)"><span class="k">parse err</span> <span class="v">${parseErrors}</span></span>`);
  fileMeta.push(`<span><span class="k">size</span> <span class="v">${(text.length/1024).toFixed(1)} KB</span></span>`);
  fileMeta.push(`<span><span class="k">types</span> <span class="v">${sortedTypes.length}</span></span>`);
  $('file-meta-bar').innerHTML = `<div class="file-meta">${fileMeta.join('')}</div>`;

  // 空文件兜底
  if (events.length === 0) {
    $('timeline').innerHTML = `<div class="alert warn">⚠ Empty file or no valid JSON lines</div>`;
    return;
  }

  const meta = events.find(e => e.type === 'session_meta')?.payload || {};
  const lastTokenEv = events.filter(e => e.payload?.type === 'token_count' && e.payload?.info?.total_token_usage).pop();
  const tokens = lastTokenEv?.payload?.info?.total_token_usage;
  const ctxWin = lastTokenEv?.payload?.info?.model_context_window;
  const resumeCommand = buildResumeCommand(meta, sourceInfo);

  $('title').classList.remove('placeholder');
  $('title').textContent = meta.id ? `codex resume ${meta.id.slice(0, 8)}...` : (name || `${events.length} events`);
  $('meta').classList.add('command-mode');
  $('meta').innerHTML = renderResumeCommand(resumeCommand, meta, sourceInfo);

  // stats
  const stats = {
    turns: events.filter(e => e.type === 'turn_context').length,
    goals: events.filter(e => {
      const p = e.payload || {};
      if (p.type === 'message' && p.role === 'developer') {
        const txt = (p.content || []).map(c => c.text || '').join('');
        return txt.includes('<untrusted_objective>');
      }
      return false;
    }).length,
    goalUpdates: events.filter(e => e.payload?.type === 'function_call' && e.payload?.name === 'update_goal').length,
    cmds: events.filter(e => e.payload?.type === 'exec_command_end').length,
    patches: events.filter(e => e.payload?.type === 'patch_apply_end').length,
    plans: events.filter(e => {
      if (e.payload?.type === 'item_completed' && e.payload?.item?.type === 'plan') return true;
      if (e.type === 'response_item' && e.payload?.type === 'message' && e.payload?.role === 'assistant') {
        const txt = (e.payload.content || []).map(c => c.text || '').join('');
        if (/<proposed_plan>/.test(txt)) return true;
      }
      return false;
    }).length,
    questions: events.filter(e => e.payload?.type === 'function_call' && e.payload?.name === 'request_user_input').length,
    todos: events.filter(e => e.payload?.type === 'function_call' && e.payload?.name === 'update_plan').length,
    reasoning: events.filter(e => e.payload?.type === 'reasoning').length,
  };
  const chips = [];
  if (stats.turns) chips.push(`<span class="chip purple"><b>${stats.turns}</b> ${t('turns_word')}</span>`);
  if (stats.goals) chips.push(`<span class="chip purple"><b>${stats.goals}</b> ${t('goals_word')}${stats.goalUpdates ? ` (+${stats.goalUpdates} ${t('updates_word')})` : ''}</span>`);
  if (stats.questions) chips.push(`<span class="chip amber"><b>${stats.questions}</b> ${t('questions_word')}</span>`);
  if (stats.plans) chips.push(`<span class="chip green"><b>${stats.plans}</b> ${t('plans_word')}</span>`);
  if (stats.todos) chips.push(`<span class="chip blue"><b>${stats.todos}</b> ${t('todo_word')}</span>`);
  if (stats.cmds) chips.push(`<span class="chip"><b>${stats.cmds}</b> ${t('cmds_word')}</span>`);
  if (stats.patches) chips.push(`<span class="chip"><b>${stats.patches}</b> ${t('patches_word')}</span>`);
  if (stats.reasoning) chips.push(`<span class="chip"><b>${stats.reasoning}</b> ${t('reasoning_chip')}</span>`);
  $('stats').innerHTML = chips.join('');

  // ============== EXTENDED STATS GRID ==============
  // 时间跨度
  const timestamps = events.map(e => {
    const ts = e.timestamp || (e.payload && e.payload.timestamp);
    if (typeof ts === 'string') return Date.parse(ts);
    if (typeof ts === 'number') return ts;
    if (typeof e.ts_ms === 'number') return e.ts_ms;
    return null;
  }).filter(Boolean);
  const tsStart = timestamps.length ? Math.min(...timestamps) : null;
  const tsEnd = timestamps.length ? Math.max(...timestamps) : null;
  const durationMs = (tsStart && tsEnd) ? tsEnd - tsStart : 0;

  // 命令成功率
  const cmdEvents = events.filter(e => e.payload?.type === 'exec_command_end');
  const cmdSuccess = cmdEvents.filter(e => e.payload?.exit_code === 0).length;
  const cmdSuccessRate = cmdEvents.length ? Math.round(cmdSuccess / cmdEvents.length * 100) : 0;
  const totalCmdSecs = cmdEvents.reduce((sum, e) => sum + (e.payload?.duration?.secs || 0), 0);

  // patches 累计变更行数 + 文件类型
  const patchEvents = events.filter(e => e.payload?.type === 'patch_apply_end');
  const patchActions = { add: 0, update: 0, delete: 0, rename: 0 };
  const patchFiles = new Set();
  let totalPatchLines = 0;
  for (const ev of patchEvents) {
    const changes = ev.payload?.changes || {};
    for (const [path, info] of Object.entries(changes)) {
      patchFiles.add(path);
      const action = info.type || 'update';
      if (patchActions[action] !== undefined) patchActions[action]++;
      const content = info.content || info.diff || '';
      totalPatchLines += content.split('\n').length;
    }
  }

  // mode breakdown
  const turnContexts = events.filter(e => e.type === 'turn_context');
  const planTurns = turnContexts.filter(e => e.payload?.collaboration_mode?.mode === 'plan').length;
  const defaultTurns = turnContexts.filter(e => e.payload?.collaboration_mode?.mode === 'default').length;

  // model
  const modelUsed = turnContexts[0]?.payload?.model || meta.modelProvider || '?';
  const personality = turnContexts[0]?.payload?.personality;

  // goal final status (from last update_goal or last untrusted_objective with budget check)
  const goalUpdates = events.filter(e => e.payload?.type === 'function_call' && e.payload?.name === 'update_goal');
  let finalGoalStatus = null;
  if (goalUpdates.length) {
    try {
      const last = JSON.parse(goalUpdates[goalUpdates.length - 1].payload.arguments || '{}');
      finalGoalStatus = last.status;
    } catch (e) {}
  }
  // 如果没 update_goal · 看最后一个 untrusted_objective 的 budget 是否超
  if (!finalGoalStatus && stats.goals > 0) {
    const goalDevMsgs = events.filter(e => {
      const p = e.payload || {};
      if (p.type !== 'message' || p.role !== 'developer') return false;
      const txt = (p.content || []).map(c => c.text || '').join('');
      return txt.includes('<untrusted_objective>');
    });
    if (goalDevMsgs.length) {
      const lastTxt = (goalDevMsgs[goalDevMsgs.length - 1].payload.content || []).map(c => c.text || '').join('');
      const tu = +(lastTxt.match(/Tokens used:\s*(\d+)/)?.[1] || 0);
      const tb_raw = lastTxt.match(/Token budget:\s*(\w+)/)?.[1] || 'unlimited';
      const tb = (tb_raw === 'unlimited' || tb_raw === 'none') ? null : +tb_raw;
      if (tb && tu > tb) finalGoalStatus = 'budget_limited';
      else finalGoalStatus = 'pursuing';
    }
  }

  // 格式化时长
  function fmtDuration(ms) {
    if (!ms) return '—';
    const s = Math.round(ms / 1000);
    if (s < 60) return `${s}s`;
    const m = Math.floor(s / 60);
    const sec = s % 60;
    if (m < 60) return `${m}m ${sec}s`;
    const h = Math.floor(m / 60);
    return `${h}h ${m % 60}m`;
  }
  function fmtTime(ms) {
    if (!ms) return '—';
    const d = new Date(ms);
    return d.toLocaleString('en-CA', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
  }

  // 渲染 grid
  const cells = [];
  cells.push(`
    <div class="stat-cell">
      <div class="stat-label">${t('stat_duration')}</div>
      <div class="stat-value purple">${fmtDuration(durationMs)}</div>
      <div class="stat-sub">${fmtTime(tsStart)} → ${fmtTime(tsEnd)}</div>
    </div>`);
  if (tokens) {
    const total = tokens.total_tokens || 0;
    const ctx = ctxWin || 258400;
    const ctxPct = Math.round((total / ctx) * 100);
    cells.push(`
      <div class="stat-cell">
        <div class="stat-label">${t('stat_tokens')}</div>
        <div class="stat-value amber">${total.toLocaleString()}</div>
        <div class="stat-sub">in ${(tokens.input_tokens||0).toLocaleString()} · out ${(tokens.output_tokens||0).toLocaleString()} · ctx ${ctxPct}%</div>
      </div>`);
  } else {
    cells.push(`<div class="stat-cell"><div class="stat-label">${t('stat_tokens')}</div><div class="stat-value">—</div><div class="stat-sub">${t('no_tokens_event')}</div></div>`);
  }
  cells.push(`
    <div class="stat-cell">
      <div class="stat-label">${t('stat_model')}</div>
      <div class="stat-value">${escapeHtml(modelUsed || '—')}</div>
      <div class="stat-sub">${personality || ''} · plan ${planTurns} · default ${defaultTurns}</div>
    </div>`);
  if (stats.goals > 0) {
    const cls = finalGoalStatus === 'achieved' || finalGoalStatus === 'complete' ? 'green'
              : finalGoalStatus === 'budget_limited' ? 'amber'
              : finalGoalStatus === 'unmet' ? 'red'
              : 'purple';
    cells.push(`
      <div class="stat-cell">
        <div class="stat-label">${t('stat_goal_status')}</div>
        <div class="stat-value ${cls}">${escapeHtml((finalGoalStatus||'pursuing').toUpperCase())}</div>
        <div class="stat-sub">${stats.goals} set · ${stats.goalUpdates} ${t('updates_word')}</div>
      </div>`);
  } else {
    cells.push(`<div class="stat-cell"><div class="stat-label">${t('stat_goal_status')}</div><div class="stat-value">—</div><div class="stat-sub">${t('no_goal_set')}</div></div>`);
  }
  if (cmdEvents.length) {
    const rateCls = cmdSuccessRate >= 95 ? 'green' : cmdSuccessRate >= 70 ? 'amber' : 'red';
    cells.push(`
      <div class="stat-cell">
        <div class="stat-label">${t('stat_commands')}</div>
        <div class="stat-value ${rateCls}">${cmdEvents.length}</div>
        <div class="stat-sub">${cmdSuccessRate}% ${t('cmds_ok')} · ${fmtDuration(totalCmdSecs * 1000)}</div>
      </div>`);
  }
  if (patchFiles.size > 0) {
    cells.push(`
      <div class="stat-cell">
        <div class="stat-label">${t('stat_files')}</div>
        <div class="stat-value blue">${patchFiles.size}</div>
        <div class="stat-sub">${patchEvents.length} ${t('patches_word')} · ${totalPatchLines.toLocaleString()} ${t('lines_word')}</div>
      </div>`);
  }
  if (stats.questions > 0) {
    const ansCount = events.filter(e => {
      const p = e.payload || {};
      if (p.type !== 'function_call_output') return false;
      try { return JSON.parse(p.output || '{}').answers; } catch { return false; }
    }).length;
    cells.push(`
      <div class="stat-cell">
        <div class="stat-label">${t('stat_qa')}</div>
        <div class="stat-value amber">${stats.questions}</div>
        <div class="stat-sub">${ansCount} ${t('rounds_answered')}</div>
      </div>`);
  }
  if (stats.plans > 0) {
    cells.push(`
      <div class="stat-cell">
        <div class="stat-label">${t('stat_plans')}</div>
        <div class="stat-value green">${stats.plans}</div>
        <div class="stat-sub">${stats.todos} ${t('todo_updates')}</div>
      </div>`);
  }
  $('stats-grid').innerHTML = cells.join('');

  if (tokens) {
    const used = tokens.total_tokens || 0;
    const ctx = ctxWin || 258400;
    const pct = Math.min(100, (used / ctx) * 100);
    $('token-fill').style.width = pct + '%';
    $('token-text').textContent = `tokens · ${used.toLocaleString()} (in ${tokens.input_tokens?.toLocaleString() || '0'} · out ${tokens.output_tokens?.toLocaleString() || '0'} · cached ${tokens.cached_input_tokens?.toLocaleString() || '0'})`;
    $('window-text').textContent = `ctx ${ctx.toLocaleString()}`;
  }

  $('timeline').innerHTML = renderTimeline(events);
}

// ============== FILE PICKER + DRAG-DROP ==============
$('file').addEventListener('change', (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = (ev) => processSession(ev.target.result, { name: f.name });
  r.readAsText(f);
});

const picker = $('picker');
['dragenter', 'dragover'].forEach(evt => picker.addEventListener(evt, (e) => { e.preventDefault(); picker.classList.add('dragging'); }));
['dragleave', 'drop'].forEach(evt => picker.addEventListener(evt, (e) => { e.preventDefault(); picker.classList.remove('dragging'); }));
picker.addEventListener('drop', (e) => {
  const f = e.dataTransfer.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = (ev) => processSession(ev.target.result, { name: f.name });
  r.readAsText(f);
});

// init i18n
$('lang-en').classList.toggle('active', LANG === 'en');
$('lang-cn').classList.toggle('active', LANG === 'cn');
applyStaticI18n();

// auto-load via ?file=
const qp = new URLSearchParams(location.search);
const url = qp.get('file');
if (url) {
  fetch(url).then(r => r.text()).then(text => processSession(text, { name: url, sourcePath: url })).catch(e => {
    $('title').textContent = (LANG === 'cn' ? '加载失败 · ' : 'Load failed · ') + (e.message || url);
  });
}
</script>
</body>
</html>
